server:
  port: 8091
spring:
  application:
    name: "franchise-api"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
  data:
    mongodb:
      uri: "mongodb+srv://luiscardosoy_db_user:mongoDBLuis@cluster1.futzmhz.mongodb.net/franchise-db?appName=Cluster1"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8091"

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    path: "/v3/api-docs"

resilience4j:
  circuitbreaker:
    instances:
      franchiseCircuitBreaker:
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        slidingWindowSize: 10
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowType: COUNT_BASED
        registerHealthIndicator: true
